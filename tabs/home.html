<!-- ============================================================
     tabs/home.html
     「フォルダー」タブの中身(フォルダー・単語帳の一覧画面)
     実際の描画・データ取得は js/folders.js(FoldersTab.init)が行う。
     ============================================================ -->
<div id="folders-tab-root">
  <div class="section-toolbar">
    <div class="breadcrumb" id="folders-breadcrumb"><!-- js/folders.js が生成 --></div>
    <button type="button" class="btn btn-primary" id="btn-add-new">
      <i class="fa-solid fa-plus"></i> <span id="btn-add-new-label">新規フォルダー</span>
    </button>
  </div>

  <div class="card-grid" id="folders-grid">
    <div class="placeholder-card"><i class="fa-solid fa-spinner fa-spin"></i><p>読み込み中...</p></div>
  </div>
</div>

<!-- フォルダー/単語帳の 新規作成・編集(名前とカラー) モーダル -->
<div class="modal" id="modal-item-edit" hidden>
  <div class="modal-box" style="max-width:380px;">
    <div class="modal-header">
      <h2 id="item-edit-title">新規フォルダー</h2>
      <button type="button" class="btn-icon" id="btn-close-item-edit"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div class="field">
      <label for="item-edit-name">名前</label>
      <input type="text" id="item-edit-name" maxlength="40" placeholder="名前を入力">
      <div class="field-error" id="item-edit-name-error"></div>
    </div>
    <div class="field">
      <label>カラー</label>
      <div class="color-swatches" id="item-edit-colors"><!-- js/folders.js が生成 --></div>
      <div class="color-custom-row">
        <input type="color" id="item-edit-custom-color" value="#F2CF00">
        <label for="item-edit-custom-color" style="font-size:12px;color:var(--color-text-muted);font-weight:400;">任意の色(RGB)を選択</label>
      </div>
    </div>
    <div class="auth-step-nav">
      <button type="button" class="btn btn-secondary" id="btn-item-edit-cancel">キャンセル</button>
      <button type="button" class="btn btn-primary" id="btn-item-edit-save">保存</button>
    </div>
  </div>
</div>
