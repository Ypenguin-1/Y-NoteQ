<!-- ============================================================
     tabs/account.html
     「アカウント」タブの中身(ユーザー情報・個人Level・テスト実施記録)
     実際の描画・データ取得は js/account.js(AccountTab.init)が行う。
     PC版ではタブバーに表示されず、ヘッダーのアカウントメニュー「プロフィール」から
     この画面(loadTab('account'))に遷移する。
     ============================================================ -->
<div id="account-tab-root">

  <section class="panel account-profile">
    <div class="account-profile-avatar" id="account-avatar-large">?</div>
    <div class="account-profile-info">
      <div class="account-username-row">
        <input type="text" id="account-username-input" class="account-username-input" maxlength="20" placeholder="ユーザーネーム">
        <button type="button" class="btn-icon" id="btn-save-username" title="保存"><i class="fa-solid fa-check"></i></button>
      </div>
      <p id="account-email"></p>
    </div>
  </section>

  <!-- 仕様修正2026/09/12 No.5: アカウントアイコン(背景色・表示文字)のカスタマイズ -->
  <section class="panel">
    <h2 class="panel-title"><i class="fa-solid fa-icons"></i> アイコン設定</h2>
    <div class="account-avatar-edit-row">
      <div class="field" style="margin-bottom:0;">
        <label for="account-avatar-number-input">通し番号(4桁・任意)</label>
        <input type="text" id="account-avatar-number-input" class="account-avatar-number-input" maxlength="4" inputmode="numeric" placeholder="1234">
      </div>
      <div class="field" style="margin-bottom:0;">
        <label for="account-avatar-text-input">表示文字(最大2文字・数字可)</label>
        <input type="text" id="account-avatar-text-input" class="account-avatar-text-input" maxlength="2" placeholder="AB">
      </div>
      <div class="field" style="margin-bottom:0;">
        <label>背景色</label>
        <div class="color-swatches" id="account-avatar-colors"><!-- js/account.js が生成 --></div>
        <div class="color-custom-row">
          <input type="color" id="account-avatar-custom-color" value="#2a8cef">
          <label for="account-avatar-custom-color" style="font-size:12px;color:var(--color-text-muted);font-weight:400;">任意の色(RGB)を選択</label>
        </div>
      </div>
      <button type="button" class="btn btn-primary" id="btn-save-avatar"><i class="fa-solid fa-check"></i> アイコンを保存</button>
    </div>
  </section>

  <section class="panel">
    <h2 class="panel-title"><i class="fa-solid fa-chart-simple"></i> 個人Level <small style="font-weight:400;color:var(--color-text-muted);">(全フォルダー・全単語帳の合計)</small></h2>
    <div class="analytics-bar" id="account-level-bar"></div>
    <div class="analytics-legend" id="account-level-legend">
      <div class="analytics-legend-item">読み込み中...</div>
    </div>
  </section>

  <section class="panel">
    <h2 class="panel-title"><i class="fa-solid fa-clock-rotate-left"></i> テスト実施記録 <span class="panel-title-count">(直近20件)</span></h2>
    <div class="table-scroll">
      <table class="word-table">
        <thead><tr><th>日時</th><th>単語帳</th><th>形式</th><th>正答率</th></tr></thead>
        <tbody id="account-test-history-body">
          <tr><td colspan="4" style="text-align:center;color:var(--color-text-muted);padding:20px;">読み込み中...</td></tr>
        </tbody>
      </table>
    </div>
  </section>
</div>
