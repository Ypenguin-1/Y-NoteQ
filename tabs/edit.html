<!-- ============================================================
     tabs/edit.html
     「編集」タブの中身(単語の追加・CSV/Excelインポート・一括操作・修正/削除)
     実際の描画・データ取得は js/edit.js(EditTab.init)が行う。
     ============================================================ -->
<div id="edit-tab-root">

  <!-- 単語帳が開かれていない場合 -->
  <div id="edit-empty" class="placeholder-card" hidden>
    <i class="fa-solid fa-book-open"></i>
    <p>単語帳が選択されていません。<br>「フォルダー」タブから単語帳を開いてください。</p>
    <button type="button" class="btn btn-primary" id="btn-edit-goto-folders" style="margin-top:16px;">フォルダーへ移動</button>
  </div>

  <div id="edit-content" hidden>

    <!-- ---------- 直接入力で単語を追加 ---------- -->
    <section class="panel">
      <h2 class="panel-title"><i class="fa-solid fa-circle-plus"></i> 単語を追加</h2>
      <div class="filter-grid">
        <div class="field">
          <label for="add-word-input">単語 <small>(複数正答は | 区切り。例: apple | orange)</small></label>
          <input type="text" id="add-word-input" placeholder="例: apple">
        </div>
        <div class="field">
          <label for="add-meaning-input">意味 <small>(複数正答は | 区切り)</small></label>
          <input type="text" id="add-meaning-input" placeholder="例: りんご">
        </div>
      </div>
      <div class="field">
        <label>登録時の暗記度</label>
        <div class="btn-toggle-group" id="add-word-level">
          <button type="button" class="btn-toggle active" data-value="0">未実施</button>
          <button type="button" class="btn-toggle" data-value="1">Level 1</button>
          <button type="button" class="btn-toggle" data-value="2">Level 2</button>
          <button type="button" class="btn-toggle" data-value="3">Level 3</button>
          <button type="button" class="btn-toggle" data-value="4">Level 4</button>
          <button type="button" class="btn-toggle" data-value="5">Level 5</button>
        </div>
      </div>
      <div class="test-settings-actions">
        <button type="button" class="btn btn-primary" id="btn-add-word"><i class="fa-solid fa-plus"></i> 追加</button>
      </div>
    </section>

    <!-- ---------- CSV / Excel インポート ---------- -->
    <section class="panel">
      <h2 class="panel-title"><i class="fa-solid fa-file-import"></i> CSV / Excel インポート</h2>
      <p style="font-size:13px;color:var(--color-text-muted);line-height:1.7;margin:0 0 14px;">
        1列目: 通し番号 / 2列目: 単語 / 3列目: 意味 / 4列目: 暗記度(0〜5、空欄は0)<br>
        1行目は見出しとして扱われ、2行目からインポートされます。単語・意味は複数正答を「|」区切りで入力できます。
      </p>
      <input type="file" id="import-file-input" accept=".csv,.xlsx,.xls">
    </section>

    <!-- ---------- 一括操作 ---------- -->
    <section class="panel">
      <h2 class="panel-title"><i class="fa-solid fa-layer-group"></i> 一括操作</h2>
      <div class="field">
        <label for="bulk-no-input">対象の単語No. <small>(例: 1-10 / 3,5,10 / 空欄で全件)</small></label>
        <input type="text" id="bulk-no-input" placeholder="例: 1-10, 15">
      </div>
      <div class="field">
        <label>一括で暗記度を設定するLevel</label>
        <div class="btn-toggle-group" id="bulk-level-group">
          <button type="button" class="btn-toggle" data-value="0">未実施</button>
          <button type="button" class="btn-toggle" data-value="1">Level 1</button>
          <button type="button" class="btn-toggle" data-value="2">Level 2</button>
          <button type="button" class="btn-toggle" data-value="3">Level 3</button>
          <button type="button" class="btn-toggle" data-value="4">Level 4</button>
          <button type="button" class="btn-toggle" data-value="5">Level 5</button>
        </div>
      </div>
      <div class="test-settings-actions">
        <button type="button" class="btn btn-secondary" id="btn-bulk-apply-level"><i class="fa-solid fa-check"></i> 選択したLevelを一括適用</button>
        <button type="button" class="btn btn-danger" id="btn-bulk-delete"><i class="fa-solid fa-trash"></i> 対象を一括削除</button>
      </div>
    </section>

    <!-- ---------- 単語一覧(修正・リセット・削除) ---------- -->
    <section class="panel">
      <h2 class="panel-title"><i class="fa-solid fa-table-list"></i> 単語一覧 <span class="panel-title-count" id="edit-word-count"></span></h2>
      <div class="table-scroll">
        <table class="word-table">
          <thead><tr><th>単語No.</th><th>単語</th><th>意味</th><th>暗記度</th><th>操作</th></tr></thead>
          <tbody id="edit-word-body">
            <tr><td colspan="5" style="text-align:center;color:var(--color-text-muted);padding:20px;">読み込み中...</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </div>
</div>

<!-- 単語の修正モーダル -->
<div class="modal" id="modal-word-edit" hidden>
  <div class="modal-box" style="max-width:420px;">
    <div class="modal-header">
      <h2><i class="fa-solid fa-pen"></i> 単語を修正</h2>
      <button type="button" class="btn-icon" id="btn-close-word-edit"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div class="field">
      <label for="edit-word-no">単語No.(順番)</label>
      <input type="number" id="edit-word-no" min="1">
      <div class="field-error" id="edit-word-error"></div>
    </div>
    <div class="field">
      <label for="edit-word-word">単語</label>
      <input type="text" id="edit-word-word">
    </div>
    <div class="field">
      <label for="edit-word-meaning">意味</label>
      <input type="text" id="edit-word-meaning">
    </div>
    <div class="field">
      <label>暗記度</label>
      <div class="btn-toggle-group" id="edit-word-level-group">
        <button type="button" class="btn-toggle" data-value="0">未実施</button>
        <button type="button" class="btn-toggle" data-value="1">Level 1</button>
        <button type="button" class="btn-toggle" data-value="2">Level 2</button>
        <button type="button" class="btn-toggle" data-value="3">Level 3</button>
        <button type="button" class="btn-toggle" data-value="4">Level 4</button>
        <button type="button" class="btn-toggle" data-value="5">Level 5</button>
      </div>
    </div>
    <div class="auth-step-nav">
      <button type="button" class="btn btn-secondary" id="btn-word-edit-cancel">キャンセル</button>
      <button type="button" class="btn btn-primary" id="btn-word-edit-save">保存</button>
    </div>
  </div>
</div>
